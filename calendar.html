<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGT Union Locale Épinal - Accueil</title>
    <meta name="description" content="Union Locale CGT Épinal — Actualités, événements et informations pour se syndiquer.">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png" type="image/png">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png">
    <meta name="theme-color" content="#d11f26">
    <!-- Open Graph / Social preview -->
    <meta property="og:title" content="CGT Union Locale Épinal — Accueil">
    <meta property="og:description" content="Actualités, événements et informations pour se syndiquer à la CGT Épinal.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder">
        <!-- Header will be loaded dynamically -->
    </div>

    <!-- Main Content -->
    <main>
        <section class="calendar-section">
            <div class="container">
                <h1>Agenda</h1>
                
                <div class="calendar-legend">
                    <h2>Légende</h2>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="legend-color blue"></span>
                            <span class="legend-text">Permanence</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color purple"></span>
                            <span class="legend-text">Convialité</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color red"></span>
                            <span class="legend-text">Action syndicale</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color green"></span>
                            <span class="legend-text">Administrative</span>
                        </div>
                    </div>
                </div>

                <div class="calendar-filters">
                    <button class="filter-btn active" data-filter="all">Tous</button>
                    <button class="filter-btn" data-filter="blue">Permanence</button>
                    <button class="filter-btn" data-filter="purple">Convialité</button>
                    <button class="filter-btn" data-filter="red">Action syndicale</button>
                    <button class="filter-btn" data-filter="green">Administrative</button>
                </div>

                <div id="events-container" class="events-container">
                    <!-- Events will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder">
        <!-- Footer will be loaded dynamically -->
    </div>

    <script src="js/main.js"></script>
    <script src="js/events.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
