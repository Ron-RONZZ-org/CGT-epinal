name: Run script on push

on:
  push:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Make script executable
        run: chmod +x ./generate-events-index.sh

      - name: Run script
        run: ./generate-events-index.sh
