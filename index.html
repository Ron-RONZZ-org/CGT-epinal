<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGT Union Locale Épinal - Accueil</title>
    <meta name="description" content="Union Locale CGT Épinal — Actualités, événements et informations pour se syndiquer.">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png" type="image/png">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png">
    <meta name="theme-color" content="#d11f26">
    <!-- Open Graph / Social preview -->
    <meta property="og:title" content="CGT Union Locale Épinal — Accueil">
    <meta property="og:description" content="Actualités, événements et informations pour se syndiquer à la CGT Épinal.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo-cgt.svg/942px-Logo-cgt.svg.png">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder">
        <!-- Header will be loaded dynamically -->
    </div>

    <!-- Main Content -->
    <main>
        <!-- Welcome Video Section -->
        <section class="hero-section">
            <div class="video-container">
                <video autoplay muted loop playsinline poster="img/video-poster.jpg">
                    <source src="resources/pour-ne-pas-etre-seul.mp4" type="video/mp4">
                    Votre navigateur ne supporte pas la vidéo HTML5.
                </video>
                <div class="video-overlay"></div>
                <div class="hero-content">
                    <h1>Se syndiquer, c'est pour ne pas être seul</h1>
                    <a href="contact.html" class="btn-primary">Se syndiquer</a>
                </div>
            </div>
        </section>

        <!-- News Section -->
        <section class="news-section">
            <div class="container">
                <h2>Actualités</h2>
                <div id="instagram-feed" class="instagram-feed">
                    <!-- Instagram feed will be loaded here -->
                    <div class="instagram-placeholder">
                        <p>Suivez-nous sur Instagram pour les dernières actualités</p>
                        <a href="https://www.instagram.com/cgtepinal/" target="_blank" class="btn-secondary">
                            <i class="fab fa-instagram"></i> Voir sur Instagram
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Upcoming Events Section -->
        <section class="events-section">
            <div class="container">
                <h2>Prochains événements</h2>
                <div id="upcoming-events" class="events-list">
                    <!-- Events will be loaded dynamically -->
                    <p class="loading-message">Chargement des événements...</p>
                </div>
                <a href="calendar.html" class="btn-secondary">Voir tous les événements</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder">
        <!-- Footer will be loaded dynamically -->
    </div>

    <script src="js/main.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
